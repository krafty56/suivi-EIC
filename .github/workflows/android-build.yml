name: Android build

# Construit l'APK de debug dans le cloud, sans avoir besoin d'Android Studio
# en local : pratique pour tester sur un émulateur en ligne (Appetize.io) ou
# un téléphone Android quand la machine de dev n'a pas la place pour le SDK.
on:
  push:
    branches: [main]
    paths:
      - 'ce-tracker/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dépendances
        working-directory: ce-tracker
        run: npm install

      - name: Builder l'app web
        working-directory: ce-tracker
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Copier le build web dans le projet Android
        working-directory: ce-tracker
        run: npx cap sync android

      - name: Builder l'APK de debug
        working-directory: ce-tracker/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ce-tracker/android/app/build/outputs/apk/debug/app-debug.apk
